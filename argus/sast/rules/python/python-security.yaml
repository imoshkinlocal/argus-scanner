rules:
  - id: python-command-injection
    languages: [python]
    severity: ERROR
    message: >-
      A shell command is built from a string. Use `subprocess.run` with an
      argument list and `shell=False`, and validate every argument.
    metadata:
      cwe: "CWE-78: Improper Neutralization of Special Elements used in an OS Command"
      confidence: HIGH
    patterns:
      - pattern-either:
          - pattern: os.system($CMD)
          - pattern: os.popen($CMD, ...)
          - pattern: subprocess.$FUNC(..., shell=True, ...)
          - pattern: subprocess.$FUNC($CMD, ...)
      - pattern-not: os.system("...")
      - pattern-not: os.popen("...", ...)
      - pattern-not: subprocess.$FUNC("...", ...)
      - pattern-not: subprocess.$FUNC([...], ...)
      - pattern-not: subprocess.$FUNC(..., shell=False, ...)

  - id: python-eval-exec
    languages: [python]
    severity: ERROR
    message: >-
      `eval`/`exec` on dynamic data allows arbitrary code execution. Parse the
      data with `ast.literal_eval` or a schema instead.
    metadata:
      cwe: "CWE-95: Improper Neutralization of Directives in Dynamically Evaluated Code"
      confidence: HIGH
    patterns:
      - pattern-either:
          - pattern: eval($X, ...)
          - pattern: exec($X, ...)
      - pattern-not: eval("...", ...)
      - pattern-not: exec("...", ...)

  - id: python-unsafe-deserialization
    languages: [python]
    severity: ERROR
    message: >-
      Pickle/YAML/JSON-hook deserialization of untrusted data can execute
      arbitrary code. Use `yaml.safe_load` or a data-only format.
    metadata:
      cwe: "CWE-502: Deserialization of Untrusted Data"
      confidence: HIGH
    pattern-either:
      - pattern: pickle.loads(...)
      - pattern: pickle.load(...)
      - pattern: dill.loads(...)
      - pattern: dill.load(...)
      - pattern: marshal.loads(...)
      - pattern: yaml.unsafe_load(...)
      - pattern: yaml.full_load(...)

  - id: python-yaml-load
    languages: [python]
    severity: WARNING
    message: >-
      `yaml.load` without `SafeLoader` can construct arbitrary Python objects.
      Use `yaml.safe_load`.
    metadata:
      cwe: "CWE-502: Deserialization of Untrusted Data"
      confidence: HIGH
    patterns:
      - pattern: yaml.load($DATA, ...)
      - pattern-not: yaml.load($DATA, Loader=yaml.SafeLoader, ...)
      - pattern-not: yaml.load($DATA, Loader=yaml.CSafeLoader, ...)

  - id: python-sql-injection
    languages: [python]
    severity: ERROR
    message: >-
      SQL text is assembled from dynamic data. Use driver parameters
      (`cursor.execute(sql, params)`).
    metadata:
      cwe: "CWE-89: Improper Neutralization of Special Elements used in an SQL Command"
      confidence: HIGH
    patterns:
      - pattern-either:
          - pattern: $CUR.execute("..." % $X, ...)
          - pattern: $CUR.execute("...".format(...), ...)
          - pattern: $CUR.execute("..." + $X, ...)
          - pattern: $CUR.execute(f"...", ...)
          - pattern: $CUR.executemany("..." % $X, ...)
          - pattern: $CUR.executemany("..." + $X, ...)
          - pattern: $CUR.executemany(f"...", ...)
          - pattern: $CONN.execute("..." + $X, ...)
          - pattern: $CONN.execute(f"...", ...)

  - id: python-ssti
    languages: [python]
    severity: ERROR
    message: >-
      Rendering a template from untrusted input enables server-side template
      injection, which usually leads to remote code execution.
    metadata:
      cwe: "CWE-1336: Improper Neutralization of Special Elements Used in a Template Engine"
      confidence: HIGH
    pattern-either:
      - pattern: flask.render_template_string($X, ...)
      - pattern: $APP.jinja_env.from_string($X)

  - id: python-tls-verify-disabled
    languages: [python]
    severity: ERROR
    message: >-
      TLS certificate verification is disabled, so the connection can be
      intercepted. Remove `verify=False`.
    metadata:
      cwe: "CWE-295: Improper Certificate Validation"
      confidence: HIGH
    pattern-either:
      - pattern: requests.$METHOD(..., verify=False, ...)
      - pattern: httpx.$METHOD(..., verify=False, ...)
      - pattern: $SESSION.request(..., verify=False, ...)

  - id: python-paramiko-auto-add-policy
    languages: [python]
    severity: ERROR
    message: >-
      `AutoAddPolicy` trusts any host key, which enables man-in-the-middle
      attacks. Load known hosts instead.
    metadata:
      cwe: "CWE-295: Improper Certificate Validation"
      confidence: HIGH
    pattern: $CLIENT.set_missing_host_key_policy(paramiko.AutoAddPolicy())

  - id: python-jwt-no-verify
    languages: [python]
    severity: ERROR
    message: >-
      The JWT signature is not verified. Always verify with an explicit
      algorithm and secret/key.
    metadata:
      cwe: "CWE-347: Improper Verification of Cryptographic Signature"
      confidence: HIGH
    pattern-either:
      - pattern: 'jwt.decode($TOKEN, options={"verify_signature": False}, ...)'
      - pattern: jwt.decode($TOKEN, verify=False, ...)
      - pattern: jwt.decode($TOKEN, algorithms=["none"], ...)

  - id: python-weak-hash
    languages: [python]
    severity: WARNING
    message: >-
      MD5/SHA-1 are unsuitable for security purposes. Use SHA-256+ or a password
      hashing function.
    metadata:
      cwe: "CWE-328: Use of Weak Hash"
      confidence: HIGH
    pattern-either:
      - pattern: hashlib.md5(...)
      - pattern: hashlib.sha1(...)
      - pattern: hashlib.new("md5", ...)
      - pattern: hashlib.new("sha1", ...)

  - id: python-insecure-tempfile
    languages: [python]
    severity: WARNING
    message: >-
      `tempfile.mktemp` is racy and can leak a file to another process. Use
      `tempfile.mkstemp` or `NamedTemporaryFile`.
    metadata:
      cwe: "CWE-377: Insecure Temporary File"
      confidence: HIGH
    pattern: tempfile.mktemp(...)

  - id: python-weak-file-permissions
    languages: [python]
    severity: WARNING
    message: >-
      World-writable permissions expose the file to other local users.
    metadata:
      cwe: "CWE-732: Incorrect Permission Assignment for Critical Resource"
      confidence: MEDIUM
    patterns:
      - pattern: os.chmod($PATH, $MODE)
      - metavariable-regex:
          metavariable: $MODE
          regex: ^(0o?777|0o?666|511|438)$

  - id: python-flask-debug
    languages: [python]
    severity: WARNING
    message: >-
      The Flask debugger must not be enabled in production: it exposes an
      interactive console.
    metadata:
      cwe: "CWE-489: Active Debug Code"
      confidence: MEDIUM
    pattern: $APP.run(..., debug=True, ...)
